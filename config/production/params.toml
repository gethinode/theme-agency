# Production-specific parameters

[modules.hinode.csp]
    # This site is deployed as theme-agency.gethinode.com and is embedded as a live preview by
    # the showcase pages on gethinode.com. Without this, the inherited theme default
    # (frame-ancestors 'self') makes the browser refuse the iframe.
    frame-ancestors = [
        "'self'",
        "gethinode.com"
    ]
